# Baseline configuration (paper Table tab:experiment-matrix).
# Every other config overrides exactly one field relative to this file.
name: baseline
model_checkpoint: deepset/gbert-base
dataset_name: mteb/amazon_massive_intent
dataset_config: de
text_column: text
label_column: label
learning_rate: 2.0e-5
batch_size: 16
num_epochs: 3
warmup_ratio: 0.1
weight_decay: 0.01
max_seq_length: 64
dropout: 0.1
seed: 42
